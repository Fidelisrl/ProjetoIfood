<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iFood - Projeto</title>
<style>
:root{--red:#ea1d2c;--ink:#3e3e3e;--mut:#717171;--bg:#f7f7f7;--card:#fff;--line:#e6e6e6}
@media(prefers-color-scheme:dark){:root{--ink:#eee;--mut:#a0a0a0;--bg:#161616;--card:#222;--line:#383838}}
*{box-sizing:border-box}
body{margin:0;font-family:"Nunito Sans","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--red);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.5px;flex:1}
header button{background:transparent;color:#fff;border:1px solid #fff8;padding:6px 12px;border-radius:8px;cursor:pointer}
nav{display:flex;gap:4px;background:var(--card);border-bottom:1px solid var(--line);padding:0 12px;overflow-x:auto}
nav button{background:none;border:0;border-bottom:3px solid transparent;padding:14px 16px;font:inherit;font-weight:700;color:var(--mut);cursor:pointer}
nav button.on{color:var(--red);border-color:var(--red)}
main{max-width:820px;margin:0 auto;padding:20px}
h2{margin:0 0 14px;font-size:20px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 16px;border-radius:99px;cursor:pointer;font:inherit}
.chip.on{background:var(--red);color:#fff;border-color:var(--red)}
.row{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.row .info{flex:1;min-width:180px}
.row small{color:var(--mut);display:block;margin-top:2px}
.price{font-weight:800}
.link{cursor:pointer}
button.p{background:var(--red);color:#fff;border:0;border-radius:8px;padding:9px 16px;font:inherit;font-weight:700;cursor:pointer}
button.s{background:none;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:8px 12px;font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #ea1d2c66;outline-offset:1px}
input,select{font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);width:100%}
input.q{width:64px}
form{display:grid;gap:10px;grid-template-columns:1fr 1fr}
form .full{grid-column:1/-1}
.total{font-size:20px;font-weight:800;text-align:right;margin:14px 0}
.status{background:#ea1d2c1a;color:var(--red);padding:3px 10px;border-radius:99px;font-weight:700;font-size:13px}
.login{max-width:340px;margin:12vh auto;background:var(--card);padding:28px;border-radius:16px;border:1px solid var(--line)}
.login h1{color:var(--red);margin:0 0 4px;font-size:30px;letter-spacing:-1px}
.login input{margin-top:10px}
.err{color:var(--red);min-height:20px;margin:10px 0 0;font-size:14px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}
.empty{color:var(--mut);padding:30px 0;text-align:center}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const R=n=>'R$ '+Number(n).toFixed(2).replace('.',',');
const CATS=['Todas','Marmita','Pizza','Fast-Food','Doces'];
let user=null,tab='home',cat='Todas',rests=[],aberto=null,menu=[];

const BASE=location.protocol==='file:'?'http://localhost:8080':'';
async function api(p,m='GET',b){
  let r;
  try{r=await fetch(BASE+'/api'+p,{method:m,headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined})}
  catch(e){throw new Error('Não consegui falar com o servidor. Rode "java ApiServer" e abra http://localhost:8080')}
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.erro||'Algo deu errado.');
  return j;
}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2200)}
async function run(fn){try{await fn()}catch(e){toast(e.message)}}

/* ---------- login ---------- */
function loginView(){
  $('#app').innerHTML=`<form class="login" onsubmit="doLogin(event);return false" style="display:block">
    <h1>ifood</h1><div style="color:var(--mut)">Entre para pedir ou gerenciar restaurantes</div>
    <input id="lg" placeholder="Login" autocomplete="username" autofocus>
    <input id="sn" type="password" placeholder="Senha" autocomplete="current-password">
    <div class="err" id="er"></div>
    <button class="p" style="width:100%">Entrar</button>
    <p style="color:var(--mut);font-size:13px">Teste: cliente / 1234 ou vendedor / 1234</p></form>`;
}
async function doLogin(e){
  e.preventDefault();
  try{user=await api('/login','POST',{login:$('#lg').value,senha:$('#sn').value});tab=user.vendedor?'rest':'home';shell()}
  catch(x){$('#er').textContent=x.message}
  return false;
}
function logout(){user=null;aberto=null;loginView()}

/* ---------- estrutura ---------- */
function shell(){
  const tabs=user.vendedor?[['rest','Meus restaurantes']]:[['home','Restaurantes'],['sacola','Sacola'],['pedidos','Meus pedidos']];
  $('#app').innerHTML=`<header><h1>ifood</h1><span>${esc(user.login)}</span><button onclick="logout()">Sair</button></header>
  <nav>${tabs.map(t=>`<button class="${tab===t[0]?'on':''}" onclick="go('${t[0]}')">${t[1]}</button>`).join('')}</nav><main id="v"></main>`;
  render();
}
function go(t){tab=t;aberto=null;shell()}
function render(){({home:homeV,sacola:sacolaV,pedidos:pedidosV,rest:vendedorV})[tab]()}

/* ---------- cliente ---------- */
function homeV(){run(async()=>{
  rests=await api('/restaurantes');
  if(aberto!==null)return cardapioV();
  const l=rests.filter(r=>cat==='Todas'||r.categoria===cat);
  $('#v').innerHTML=`<h2>O que você quer pedir hoje?</h2>
  <div class="chips">${CATS.map(c=>`<button class="chip ${c===cat?'on':''}" onclick="cat='${c}';homeV()">${c}</button>`).join('')}</div>`+
  (l.length?l.map(r=>`<div class="row link" onclick="abrir('${esc(r.nome).replace(/'/g,"\\'")}')"><div class="info"><b>${esc(r.nome)}</b><small>${esc(r.categoria)} - ${r.tempo} min</small></div><span class="status">Ver cardápio</span></div>`).join(''):'<div class="empty">Nenhum restaurante nessa categoria.</div>');
})}
function abrir(n){run(async()=>{aberto=n;menu=await api('/cardapio?nome='+encodeURIComponent(n));cardapioV()})}
function cardapioV(){
  $('#v').innerHTML=`<button class="s" onclick="aberto=null;homeV()">Voltar</button><h2 style="margin-top:14px">${esc(aberto)}</h2>`+
  (menu.length?menu.map((i,k)=>`<div class="row"><div class="info"><b>${esc(i.nome)}</b><small>${esc(i.descricao)}</small></div><span class="price">${R(i.preco)}</span>
  <input class="q" id="q${k}" type="number" min="1" value="1" aria-label="Quantidade"><button class="p" onclick="add(${k})">Adicionar</button></div>`).join(''):'<div class="empty">Esse restaurante ainda não tem itens no cardápio.</div>');
}
function add(k){run(async()=>{await api('/sacola','POST',{restaurante:aberto,item:menu[k].nome,quantidade:$('#q'+k).value});toast('Adicionado à sacola')})}

let sac={itens:[],total:0};
function sacolaV(){run(async()=>{
  sac=await api('/sacola');
  if(!sac.itens.length){$('#v').innerHTML='<h2>Sacola</h2><div class="empty">A sua sacola está vazia. Escolha um restaurante para começar.</div>';return}
  $('#v').innerHTML=`<h2>Sacola</h2>`+sac.itens.map((i,k)=>`<div class="row"><div class="info"><b>${esc(i.nome)}</b><small>${R(i.preco)} cada</small></div>
  <input class="q" type="number" min="0" value="${i.quantidade}" aria-label="Quantidade de ${esc(i.nome)}" onchange="qtd(${k},this.value)"><span class="price">${R(i.preco*i.quantidade)}</span></div>`).join('')+
  `<div class="total">Total: ${R(sac.total)}</div>
  <h2>Entrega e pagamento</h2>
  <form onsubmit="return pedir(event)">
    <input id="rua" placeholder="Rua" class="full" required><input id="num" placeholder="Número" required><input id="bai" placeholder="Bairro" required>
    <input id="com" placeholder="Complemento (opcional)" class="full">
    <select id="pg" class="full"><option>Dinheiro</option><option>Cartão</option><option>Pix</option></select>
    <button class="p full">Finalizar pedido</button></form>`;
})}
function qtd(k,v){run(async()=>{await api('/sacola','PUT',{item:sac.itens[k].nome,quantidade:v});sacolaV()})}
function pedir(e){e.preventDefault();run(async()=>{
  const p=await api('/pedidos','POST',{rua:$('#rua').value,numero:$('#num').value,bairro:$('#bai').value,complemento:$('#com').value,pagamento:$('#pg').value});
  toast('Pedido #'+p.numero+' confirmado!');go('pedidos')});return false}

function pedidosV(){run(async()=>{
  const l=await api('/pedidos');
  $('#v').innerHTML='<h2>Meus pedidos</h2>'+(l.length?l.map(p=>`<div class="row"><div class="info"><b>Pedido #${p.numero}</b> <span class="status">${esc(p.status)}</span>
  <small>${p.itens.map(esc).join(', ')}</small><small>${esc(p.endereco)} - ${esc(p.pagamento)}</small></div><span class="price">${R(p.total)}</span>
  ${p.entregue?'':`<button class="s" onclick="avancar(${p.numero})">Avançar status</button>`}</div>`).join(''):'<div class="empty">Você ainda não fez nenhum pedido.</div>');
})}
function avancar(n){run(async()=>{await api('/pedidos/avancar','POST',{numero:n});pedidosV()})}

/* ---------- vendedor ---------- */
function vendedorV(){run(async()=>{
  rests=await api('/restaurantes');
  $('#v').innerHTML=`<h2>Novo restaurante</h2>
  <form onsubmit="return criar(event)"><input id="rn" placeholder="Nome" required>
  <select id="rc">${CATS.slice(1).map(c=>`<option>${c}</option>`).join('')}</select>
  <input id="rt" type="number" min="1" placeholder="Tempo médio de entrega (min)" required><button class="p">Cadastrar restaurante</button></form>
  <h2 style="margin-top:28px">Restaurantes cadastrados</h2>`+
  (rests.length?rests.map((r,k)=>`<div class="row"><div class="info"><b>${esc(r.nome)}</b><small>${esc(r.categoria)} - ${r.tempo} min</small></div>
  <button class="s" onclick="item(${k})">Novo item</button><button class="s" onclick="editar(${k})">Editar</button><button class="s" onclick="del(${k})">Excluir</button></div>`).join(''):'<div class="empty">Nenhum restaurante cadastrado.</div>');
})}
function criar(e){e.preventDefault();run(async()=>{await api('/restaurantes','POST',{nome:$('#rn').value,categoria:$('#rc').value,tempo:$('#rt').value});toast('Restaurante adicionado');vendedorV()});return false}
function editar(k){const r=rests[k],n=prompt('Novo nome',r.nome);if(n===null)return;const c=prompt('Nova categoria',r.categoria);if(c===null)return;const t=prompt('Novo tempo médio (min)',r.tempo);if(t===null)return;
  run(async()=>{await api('/restaurantes?nome='+encodeURIComponent(r.nome),'PUT',{nome:n,categoria:c,tempo:t});toast('Restaurante atualizado');vendedorV()})}
function del(k){if(!confirm('Excluir '+rests[k].nome+'?'))return;run(async()=>{await api('/restaurantes?nome='+encodeURIComponent(rests[k].nome),'DELETE');toast('Restaurante removido');vendedorV()})}
function item(k){const n=prompt('Nome do item');if(!n)return;const d=prompt('Descrição')||'';const p=prompt('Preço (ex: 19.90)');if(!p)return;
  run(async()=>{await api('/cardapio','POST',{restaurante:rests[k].nome,nome:n,descricao:d,preco:p.replace(',','.')});toast('Item adicionado')})}

loginView();
</script>
</body>
</html>
